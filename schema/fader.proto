// Defines the fader control event shared by the Kotlin master and C++ components.
syntax = "proto3";

package archx;

option java_package = "dev.archx.schema";
option java_multiple_files = true;

// Reports a fader position and whether the physical control is currently touched.
message FaderMoved {
  uint32 fader_id = 1;
  float  value    = 2;  // Normalized fader position in the inclusive range 0.0 to 1.0.
  bool   touched  = 3;
}
