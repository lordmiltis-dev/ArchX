// Defines the Protobuf message sent from the Kotlin master to the C++ DMX submaster.
// Transport uses TCP on 127.0.0.1; each message is a 4-byte unsigned little-endian
// length followed by a Protobuf payload.
syntax = "proto3";

package archx.dmxlink;

// One complete 512-channel DMX universe, identified by its zero-based universe number.
message DmxFrame {
  // 0..32767 (Art-Net: 15 bits). uint32 lets the submaster detect and reject
  // oversized values instead of silently truncating them.
  uint32 universe = 1;
  // Exactly 512 bytes. The submaster rejects other lengths.
  bytes data = 2;
}
