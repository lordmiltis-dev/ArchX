// Defines the persisted show, fixture patch, and channel metadata structures.
syntax = "proto3";

package archx;

option java_package = "dev.archx.schema";
option java_multiple_files = true;

// A show contains its fixture definitions and the patches that use them.
message Showfile {
  string name = 1;                          // Display name of the show.
  repeated FixtureType fixture_types = 2;   // Fixture definitions copied from the source library.
  repeated PatchEntry patch = 3;            // Fixtures assigned to DMX universes and addresses.
  uint32 next_patch_id = 4;                 // Next internal patch ID to allocate.
}

// One fixture instance assigned to the stage.
message PatchEntry {
  uint32 id = 1;               // Unique internal ID; allocated IDs are never reused.
  uint32 fixture_number = 2;   // User-visible fixture number, editable independently of the internal ID.
  string name = 3;             // Name of this patch.
  uint32 fixture_type_id = 4;  // References a FixtureType.id in this show.
  uint32 universe = 5;         // One-based universe; zero means the fixture is unpatched.
  uint32 address = 6;          // One-based start address in the universe; zero means unpatched.
  bool virtual_dimmer = 7;     // Derive intensity by scaling the fixture's color channels.
  bool invert_pan = 8;         // Invert the pan direction.
  bool invert_tilt = 9;        // Invert the tilt direction.
  repeated SubFixtureSettings sub_fixtures = 10;  // Per-cell overrides; only differing values need entries.
}

// Settings that override pan or tilt behavior for one cell of a patched fixture.
message SubFixtureSettings {
  uint32 index = 1;            // One-based cell index matching SubFixtureDef.index.
  bool invert_pan = 2;
  bool invert_tilt = 3;
}

// Describes a fixture mode, including its channels and optional independently controlled cells.
message FixtureType {
  uint32 id = 1;                 // ID within this show.
  string manufacturer = 2;       // Fixture manufacturer.
  string name = 3;               // Fixture name in the source library.
  string mode_name = 4;          // Mode name, for example "16-channel".
  string library_key = 5;        // Profile key, unique together with library_source.
  uint32 channel_count = 6;      // Number of DMX slots occupied by this mode.
  repeated ChannelDef channels = 7;          // Channels shared by the complete fixture, such as pan or dimmer.
  repeated SubFixtureDef sub_fixtures = 8;   // Independently controlled cells; empty for ordinary fixtures.
  string library_source = 9;     // Library or extension that supplied the profile, such as "onyx".
  string library_revision = 10;  // Profile version or checksum used to detect library changes.
}

// Describes the role and DMX offsets of one fixture channel.
message ChannelDef {
  uint32 offset = 1;          // One-based offset from the start of the complete fixture.
  Attribute attribute = 2;    // Function controlled by this channel.
  uint32 fine_offset = 3;     // Optional second offset for 16-bit control; zero means no fine channel.
  string name = 4;            // Channel name from the library, such as "Pan" or "Frame 2A".
  uint32 default_value = 5;   // Output when no source controls the channel; zero means unset.
                              // Values use the channel resolution: 0..255 for 8-bit or 0..65535 for 16-bit.
  uint32 highlight_value = 6; // Optional highlight output in the same resolution as default_value.
  Precedence precedence = 7;  // Rule for combining multiple sources that control this channel.
}

// One independently controlled cell of a fixture, such as an LED segment.
message SubFixtureDef {
  uint32 index = 1;                  // One-based cell index within the fixture.
  string name = 2;                   // Display name of the cell.
  repeated ChannelDef channels = 3;  // Cell-specific channels, such as RGB or pan and tilt.
  float pos_x = 4;                   // Horizontal fixture-relative position for pixel mapping.
  float pos_y = 5;                   // Vertical fixture-relative position for pixel mapping.
}

// Functions that a fixture channel can control.
enum Attribute {
  ATTRIBUTE_UNSPECIFIED = 0;
  ATTRIBUTE_INTENSITY = 1;
  ATTRIBUTE_RED = 2;
  ATTRIBUTE_GREEN = 3;
  ATTRIBUTE_BLUE = 4;
  ATTRIBUTE_WHITE = 5;
  ATTRIBUTE_AMBER = 6;
  ATTRIBUTE_UV = 7;
  ATTRIBUTE_PAN = 8;
  ATTRIBUTE_TILT = 9;
  ATTRIBUTE_COLOR_WHEEL = 10;
  ATTRIBUTE_GOBO = 11;
  ATTRIBUTE_ZOOM = 12;
  ATTRIBUTE_FOCUS = 13;
  ATTRIBUTE_IRIS = 14;
  ATTRIBUTE_STROBE = 15;
  ATTRIBUTE_SPEED = 16;
  ATTRIBUTE_CONTROL = 17;
  ATTRIBUTE_OTHER = 18;
  ATTRIBUTE_CYAN = 19;
  ATTRIBUTE_MAGENTA = 20;
  ATTRIBUTE_YELLOW = 21;
  ATTRIBUTE_COLOR_TEMPERATURE = 22;
  ATTRIBUTE_PAN_TILT_SPEED = 23;
  ATTRIBUTE_PRISM = 24;
  ATTRIBUTE_PRISM_ROTATION = 25;
  ATTRIBUTE_FROST = 26;
  ATTRIBUTE_GOBO_ROTATION = 27;
  ATTRIBUTE_EFFECT = 28;
  ATTRIBUTE_SOUND_SENSITIVITY = 29;
  ATTRIBUTE_FRAMING_BLADE = 30;
  ATTRIBUTE_FRAMING_ROTATION = 31;
}

// Rule used by the master to combine values from multiple sources.
enum Precedence {
  PRECEDENCE_UNSPECIFIED = 0;  // Defaults to HTP for intensity and LTP for other attributes.
  PRECEDENCE_HTP = 1;          // Highest Takes Precedence: the highest value wins.
  PRECEDENCE_LTP = 2;          // Latest Takes Precedence: the most recently set value wins.
}
