name: Bug report
description: Report an error or unexpected behavior in ArchX.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for taking the time to report a bug. Please provide enough detail
        for us to reproduce and investigate it.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the bug clearly and concisely.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce the behavior.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include error messages if available.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ArchX version or commit
      description: Which version or commit are you using?
      placeholder: e.g. v1.2.3 or abc1234

  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or logs that may help.
    validations:
      required: false
